name: iOS Simulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  simulator-build:
    name: Build and screenshot on macOS runner
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show installed toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -n 20

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project InCaseI4Get.xcodeproj \
            -scheme InCaseI4Get \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator and launch app
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | \
            perl -ne 'if (/^\s*(?:iPhone .*?) \(([0-9A-F-]+)\)/) { print "$1\n"; exit }')
          echo "Using simulator: $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" \
            DerivedData/Build/Products/Debug-iphonesimulator/InCaseI4Get.app
          xcrun simctl launch "$UDID" com.incasei4get.InCaseI4Get
          sleep 12
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/home.png
          xcrun simctl spawn "$UDID" log show --last 1m \
            --predicate 'process == "InCaseI4Get"' > artifacts/simulator.log || true
          echo "App launch attempt finished"

      - name: Run unit and UI tests
        run: |
          xcodebuild test \
            -project InCaseI4Get.xcodeproj \
            -scheme InCaseI4Get \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export test screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            mkdir -p artifacts/test-attachments
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path artifacts/test-attachments
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            artifacts/**
            TestResults.xcresult
          if-no-files-found: error
